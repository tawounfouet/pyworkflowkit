name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[security]"

      - name: Bandit
        run: bandit -q -r src/pyworkflowkit -x src/pyworkflowkit/migrations

      - name: Dependency audit
        run: pip-audit --skip-editable

      - name: Secret scan
        run: |
          detect-secrets scan src/pyworkflowkit > /tmp/pyworkflowkit-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/pyworkflowkit-secrets.json").read_text())
          results = report.get("results", {})
          if results:
              print(json.dumps(results, indent=2, sort_keys=True))
              raise SystemExit("detect-secrets found candidate secrets in src/pyworkflowkit")
          PY

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

      - name: Dependency review availability
        if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::GitHub Dependency Review is unavailable until Dependency Graph is enabled for this repository."

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test with coverage
        run: |
          pytest             --cov=pyworkflowkit             --cov-branch             --cov-report=term-missing             --cov-report=xml

  build:
    name: Build and install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build
        run: python -m build

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Import smoke
        run: python -c "import pyworkflowkit; print(pyworkflowkit.__version__)"

      - name: Release metadata smoke
        run: |
          python -c "from importlib.metadata import version; assert version('pyworkflowkit') == '0.6.0'"
          python -c "import pyworkflowkit; assert pyworkflowkit.__version__ == '0.6.0'"
          pyworkflow version | grep -Fx "0.6.0"

      - name: Migration resources smoke
        run: |
          python -c "from importlib.resources import files; versions=files('pyworkflowkit.migrations.versions'); assert versions.joinpath('0001_runtime_metadata.py').is_file(); assert versions.joinpath('0002_task_output_checkpoints.py').is_file(); assert versions.joinpath('0003_retry_eligible_at.py').is_file()"


  acceptance:
    name: Reference acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Reference workflows
        run: pytest tests/reference -q

      - name: Hello-world example
        run: |
          python examples/00_hello_world.py > /tmp/pyworkflowkit-manifest.json
          python -c "import json; json.load(open('/tmp/pyworkflowkit-manifest.json', encoding='utf-8'))"


  postgres:
    name: PostgreSQL contract
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pyworkflowkit
          POSTGRES_PASSWORD: pyworkflowkit
          POSTGRES_DB: pyworkflowkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyworkflowkit -d pyworkflowkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYWORKFLOWKIT_TEST_POSTGRES_DSN: postgresql+psycopg://pyworkflowkit:pyworkflowkit@127.0.0.1:5432/pyworkflowkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: PostgreSQL integration contract
        run: pytest tests/integration/test_postgres_metadata_store.py tests/integration/test_migrations_postgres.py -q
