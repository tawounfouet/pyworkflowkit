name: Release Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/verify_release_metadata.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/verify_release_metadata.py
          fi

  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Record checksums
        run: sha256sum dist/* | tee dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist/
          if-no-files-found: error

  artifact-install:
    name: Artifact install (${{ matrix.python-version }}, ${{ matrix.kind }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            kind: wheel
          - python-version: "3.12"
            kind: wheel
          - python-version: "3.13"
            kind: wheel
          - python-version: "3.13"
            kind: sdist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Resolve expected version
        run: |
          echo "EXPECTED_VERSION=$(python scripts/verify_release_metadata.py --print-version)" >> "$GITHUB_ENV"

      - name: Install built artifact
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            package=$(ls dist/*.whl)
          else
            package=$(ls dist/*.tar.gz)
          fi
          python -m pip install "$package"

      - name: Installed-package contract smoke
        shell: bash
        run: |
          cd /tmp
          python - <<'PY'
          import os
          from importlib.resources import files

          import pyworkflowkit
          from pyworkflowkit.release_contract import release_contract_snapshot

          expected = os.environ["EXPECTED_VERSION"]
          assert pyworkflowkit.__version__ == expected

          snapshot = release_contract_snapshot()
          assert snapshot["package_version"] == expected
          assert snapshot["qualification_contract_version"] == "1"
          assert snapshot["contracts"] == {
              "cli_machine": "1",
              "manifest": "1",
              "persistence": "1",
              "plugin_api": "1",
          }
          assert snapshot["migration_head"] == "0003_retry_eligible_at"

          versions = files("pyworkflowkit.migrations.versions")
          assert versions.joinpath("0001_runtime_metadata.py").is_file()
          assert versions.joinpath("0002_task_output_checkpoints.py").is_file()
          assert versions.joinpath("0003_retry_eligible_at.py").is_file()
          PY
          test "$(pyworkflow version)" = "$EXPECTED_VERSION"

  transverse-v0-8:
    name: 0.8 transverse qualification
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install qualification build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Qualify complete 0.8 ecosystem against built wheel
        shell: bash
        run: |
          core_wheel=$(ls dist/*.whl)
          python scripts/qualify_v0_8_transverse.py --core-wheel "$core_wheel"

  ecosystem-sdk:
    name: Ecosystem SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ecosystem build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Qualify SDK against built wheel
        shell: bash
        run: |
          core_wheel=$(ls dist/*.whl)
          python scripts/qualify_ecosystem_sdk.py --core-wheel "$core_wheel"

  control-plane-provider:
    name: Control-plane provider
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Qualify installed control-plane provider
        shell: bash
        run: |
          core_wheel=$(ls dist/*.whl)
          python scripts/qualify_control_plane_provider.py --core-wheel "$core_wheel"

  reference-integrations:
    name: Reference integration packages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install integration build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Qualify independently packaged integrations
        shell: bash
        run: |
          core_wheel=$(ls dist/*.whl)
          python scripts/qualify_reference_integrations.py --core-wheel "$core_wheel"

  reference-contracts:
    name: Contract snapshots
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Reference acceptance
        run: pytest tests/reference -q

  sqlite-upgrade:
    name: SQLite upgrade (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: SQLite upgrade matrix
        run: pytest tests/integration/test_migrations.py -q

  postgres-upgrade:
    name: PostgreSQL upgrade (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pyworkflowkit
          POSTGRES_PASSWORD: pyworkflowkit
          POSTGRES_DB: pyworkflowkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyworkflowkit -d pyworkflowkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYWORKFLOWKIT_TEST_POSTGRES_DSN: postgresql+psycopg://pyworkflowkit:pyworkflowkit@127.0.0.1:5432/pyworkflowkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: PostgreSQL upgrade matrix
        run: pytest tests/integration/test_migrations_postgres.py -q

  security:
    name: Release security gates
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[security]"

      - name: Bandit
        run: bandit -q -r src/pyworkflowkit -x src/pyworkflowkit/migrations

      - name: Dependency audit
        run: pip-audit --skip-editable

      - name: Secret scan
        run: |
          detect-secrets scan src/pyworkflowkit > /tmp/pyworkflowkit-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/pyworkflowkit-secrets.json").read_text())
          results = report.get("results", {})
          if results:
              print(json.dumps(results, indent=2, sort_keys=True))
              raise SystemExit("detect-secrets found candidate secrets in src/pyworkflowkit")
          PY

  release-gate:
    name: Release qualification gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - metadata
      - build
      - artifact-install
      - reference-contracts
      - reference-integrations
      - control-plane-provider
      - ecosystem-sdk
      - transverse-v0-8
      - sqlite-upgrade
      - postgres-upgrade
      - security

    steps:
      - name: Require every release gate
        shell: bash
        run: |
          test "${{ needs.metadata.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.artifact-install.result }}" = "success"
          test "${{ needs.reference-contracts.result }}" = "success"
          test "${{ needs.reference-integrations.result }}" = "success"
          test "${{ needs.control-plane-provider.result }}" = "success"
          test "${{ needs.ecosystem-sdk.result }}" = "success"
          test "${{ needs.transverse-v0-8.result }}" = "success"
          test "${{ needs.sqlite-upgrade.result }}" = "success"
          test "${{ needs.postgres-upgrade.result }}" = "success"
          test "${{ needs.security.result }}" = "success"
