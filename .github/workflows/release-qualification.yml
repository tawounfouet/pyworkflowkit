          test "${{ needs.static-typing.result }}" = "success"
          test "${{ needs.developer-experience.result }}" = "success"
          test "${{ needs.packaging-distribution.result }}" = "success"
          test "${{ needs.release-candidate.result }}" = "success"
          test "${{ needs.v2-release-candidate.result }}" = "success"
          test "${{ needs.v2-stable.result }}" = "success"
          test "${{ needs.reference-contracts.result }}" = "success"
          test "${{ needs.reference-integrations.result }}" = "success"
