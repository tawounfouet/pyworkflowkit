[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyworkflowkit"
version = "0.4.0a7"
description = "Reliable workflows without running a workflow platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Thomas AWOUNFOUET" },
]
keywords = [
  "workflow",
  "dag",
  "orchestration",
  "runtime",
  "python",
  "task",
  "executor",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.16,<2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.scripts]
pyworkflow = "pyworkflowkit.cli:main"
pyworkflowkit = "pyworkflowkit.cli:main"

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "build",
  "hypothesis",
  "mypy",
  "pytest",
  "pytest-cov",
  "ruff",
]

[project.urls]
Repository = "https://github.com/tawounfouet/pyworkflowkit"
Issues = "https://github.com/tawounfouet/pyworkflowkit/issues"
Changelog = "https://github.com/tawounfouet/pyworkflowkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pyworkflowkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["pyworkflowkit"]
omit = [
  "src/pyworkflowkit/migrations/env.py",
  "src/pyworkflowkit/migrations/versions/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
