name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test with coverage
        run: |
          pytest             --cov=pyworkflowkit             --cov-branch             --cov-report=term-missing             --cov-report=xml

  build:
    name: Build and install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build
        run: python -m build

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Import smoke
        run: python -c "import pyworkflowkit; print(pyworkflowkit.__version__)"

      - name: Package metadata smoke
        run: |
          python -c "from importlib.metadata import version; import pyworkflowkit; assert pyworkflowkit.__version__ == version('pyworkflowkit')"
          test "$(pyworkflow version)" = "$(python -c "from importlib.metadata import version; print(version('pyworkflowkit'))")"

      - name: Migration resources smoke
        run: |
          python -c "from importlib.resources import files; assert files('pyworkflowkit.migrations.versions').joinpath('0001_runtime_metadata.py').is_file()"


  acceptance:
    name: Reference acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Reference workflows
        run: pytest tests/reference -q

      - name: Hello-world example
        run: |
          python examples/00_hello_world.py > /tmp/pyworkflowkit-manifest.json
          python -c "import json; json.load(open('/tmp/pyworkflowkit-manifest.json', encoding='utf-8'))"


  postgres:
    name: PostgreSQL contract
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pyworkflowkit
          POSTGRES_PASSWORD: pyworkflowkit
          POSTGRES_DB: pyworkflowkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyworkflowkit -d pyworkflowkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYWORKFLOWKIT_TEST_POSTGRES_DSN: postgresql+psycopg://pyworkflowkit:pyworkflowkit@127.0.0.1:5432/pyworkflowkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: PostgreSQL integration contract
        run: pytest tests/integration/test_postgres_metadata_store.py tests/integration/test_migrations_postgres.py -q
