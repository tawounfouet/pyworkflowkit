name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[security]"

      - name: Bandit
        run: bandit -q -r src/pyworkflowkit -x src/pyworkflowkit/migrations

      - name: Dependency audit
        run: pip-audit --skip-editable

      - name: Secret scan
        run: |
          detect-secrets scan src/pyworkflowkit > /tmp/pyworkflowkit-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/pyworkflowkit-secrets.json").read_text())
          results = report.get("results", {})
          if results:
              print(json.dumps(results, indent=2, sort_keys=True))
              raise SystemExit("detect-secrets found candidate secrets in src/pyworkflowkit")
          PY

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        id: dependency-review
        continue-on-error: true
        uses: actions/dependency-review-action@v4

      - name: Dependency review availability
        if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::GitHub Dependency Review is unavailable until Dependency Graph is enabled for this repository."

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test with coverage
        run: |
          pytest             --cov=pyworkflowkit             --cov-branch             --cov-report=term-missing             --cov-report=xml

  build:
    name: Build and install smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build
        run: python -m build

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Import smoke
        run: python -c "import pyworkflowkit; print(pyworkflowkit.__version__)"

      - name: Development metadata smoke
        shell: bash
        run: |
          EXPECTED_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python -c "from importlib.metadata import version; assert version('pyworkflowkit') == '$EXPECTED_VERSION'"
          python -c "import pyworkflowkit; assert pyworkflowkit.__version__ == '$EXPECTED_VERSION'"
          test "$(pwk version)" = "$EXPECTED_VERSION"
          test "$(pyworkflowkit version)" = "$EXPECTED_VERSION"
          test "$(pyworkflow version)" = "$EXPECTED_VERSION"

      - name: Migration resources smoke
        run: |
          python -c "from importlib.resources import files; versions=files('pyworkflowkit.migrations.versions'); assert versions.joinpath('0001_runtime_metadata.py').is_file(); assert versions.joinpath('0002_task_output_checkpoints.py').is_file(); assert versions.joinpath('0003_retry_eligible_at.py').is_file(); assert versions.joinpath('0004_v2_runtime_metadata.py').is_file(); assert versions.joinpath('0005_v2_task_output_checkpoints.py').is_file()"


  public-api-freeze:
    name: 1.0 public API freeze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Qualify frozen public facades
        run: pytest tests/reference/test_v0_9_public_api_freeze.py -q


  compatibility-deprecation:
    name: 1.0 compatibility & deprecation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Qualify RQ-02 compatibility contract
        run: pytest tests/reference/test_v0_9_compatibility_deprecation.py -q


  static-typing:
    name: Static typing (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify PEP 561 marker
        run: |
          python -c "from importlib.resources import files; assert files('pyworkflowkit').joinpath('py.typed').is_file()"

      - name: Qualify RQ-03 reference contract
        run: pytest tests/reference/test_v0_9_typing_static_contracts.py -q

      - name: Type-check public consumer
        run: |
          mypy --strict --python-version "${{ matrix.python-version }}" typing-fixtures/public_consumer.py
          mypy --strict --python-version "${{ matrix.python-version }}" ecosystem-template/src/pyworkflowkit_ecosystem_template/__init__.py
          mypy --strict --python-version "${{ matrix.python-version }}" qualification-integrations/reference-executor/src/pyworkflowkit_qualification_executor/__init__.py
          mypy --strict --python-version "${{ matrix.python-version }}" reference-integrations/reference-event-sink/src/pyworkflowkit_reference_event_sink/__init__.py

      - name: Reject unsupported task handler signature
        shell: bash
        run: |
          if mypy --strict --python-version "${{ matrix.python-version }}" typing-fixtures/invalid_task_handler.py; then
            echo "invalid two-argument @task handler unexpectedly passed static typing"
            exit 1
          fi


  developer-experience:
    name: 1.0 developer experience
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Qualify RQ-04 contract
        run: pytest tests/reference/test_v0_9_developer_experience.py -q

      - name: Execute first-use journey
        run: python scripts/qualify_developer_experience.py --json


  developer-experience-v2:
    name: 1.1 transverse developer experience
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Qualify Developer Experience Contract v2
        run: pytest tests/reference/test_v1_1_cross_surface_dx.py -q

      - name: Execute transverse 1.1 journey
        run: python scripts/qualify_v1_1_developer_experience.py --json

  packaging-distribution:
    name: 1.0 packaging & distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate index metadata
        run: python -m twine check dist/*

      - name: Rebuild wheel from sdist
        run: |
          mkdir -p /tmp/rq05-rebuilt
          python -m pip wheel --no-deps --wheel-dir /tmp/rq05-rebuilt dist/*.tar.gz

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Qualify package artifacts
        shell: bash
        run: |
          rebuilt=$(ls /tmp/rq05-rebuilt/*.whl)
          python scripts/qualify_distribution.py \
            --dist-dir dist \
            --rebuilt-wheel "$rebuilt" \
            --json

      - name: Qualify RQ-05 source contract
        run: pytest tests/reference/test_v0_9_packaging_distribution.py -q


  release-candidate:
    name: 1.0 release candidate contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Qualify RQ-06 source contract
        run: pytest tests/reference/test_v0_9_release_candidate.py -q

      - name: Qualify release candidate snapshot
        run: python scripts/qualify_v1_release_candidate.py --json


  transverse-v0-8:
    name: 0.8 transverse qualification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install qualification build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Qualify scenarios A-F together
        run: python scripts/qualify_v0_8_transverse.py

  ecosystem-sdk:
    name: Ecosystem SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Qualify ecosystem SDK and template wheel
        run: python scripts/qualify_ecosystem_sdk.py

  control-plane-provider:
    name: Control-plane provider
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Qualify public provider contract
        run: python scripts/qualify_control_plane_provider.py

  reference-integrations:
    name: Reference integration packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Build, install, discover, execute, uninstall
        run: python scripts/qualify_reference_integrations.py

  acceptance:
    name: Reference acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Reference workflows
        run: pytest tests/reference -q

      - name: Hello-world example
        run: |
          python examples/00_hello_world.py > /tmp/pyworkflowkit-manifest.json
          python -c "import json; json.load(open('/tmp/pyworkflowkit-manifest.json', encoding='utf-8'))"


  postgres:
    name: PostgreSQL contract
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pyworkflowkit
          POSTGRES_PASSWORD: pyworkflowkit
          POSTGRES_DB: pyworkflowkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyworkflowkit -d pyworkflowkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYWORKFLOWKIT_TEST_POSTGRES_DSN: postgresql+psycopg://pyworkflowkit:pyworkflowkit@127.0.0.1:5432/pyworkflowkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: PostgreSQL integration contract
        run: pytest tests/integration/test_postgres_metadata_store.py tests/integration/test_migrations_postgres.py -q
