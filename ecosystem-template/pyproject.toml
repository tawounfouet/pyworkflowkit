[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyworkflowkit-ecosystem-template"
version = "0.1.0"
description = "Reference third-party integration template for PyWorkflowKit."
requires-python = ">=3.11"
dependencies = ["pyworkflowkit>=0.8.0b1,<0.9"]

[project.entry-points."pyworkflowkit.workloads"]
ecosystem-template = "pyworkflowkit_ecosystem_template:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyworkflowkit_ecosystem_template"]
