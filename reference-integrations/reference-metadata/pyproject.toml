[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyworkflowkit-reference-metadata"
version = "0.1.0"
description = "Reference MetadataStore plugin for PyWorkflowKit conformance."
requires-python = ">=3.11"
dependencies = ["pyworkflowkit>=0.8.0a4,<0.9"]

[project.entry-points."pyworkflowkit.metadata"]
reference-metadata = "pyworkflowkit_reference_metadata:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pyworkflowkit_reference_metadata"]
