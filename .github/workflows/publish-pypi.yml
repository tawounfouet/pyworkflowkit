name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build distributions and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC required for PyPI Trusted Publishing
      contents: write     # Required to upload SBOM and checksums to GitHub Release
      actions: read       # Required to verify qualification for the exact release SHA
      attestations: write # Required for Sigstore artifact build provenance

    environment:
      name: pypi
      url: https://pypi.org/p/pyworkflowkit

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.23"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate release ref and package version
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "Publishing is only allowed from a vX.Y.Z tag; got: $GITHUB_REF" >&2
              exit 1
              ;;
          esac

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(project["project"]["version"])
          PY
          )"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag/package version mismatch: tag=$TAG_VERSION package=$PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Require successful Release Qualification for exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SUCCESSFUL_RUNS="$(gh api -X GET             "repos/$GITHUB_REPOSITORY/actions/workflows/release-qualification.yml/runs"             -f head_sha="$GITHUB_SHA"             -f status="success"             -f per_page=100             --jq '.workflow_runs | length')"

          if [ "$SUCCESSFUL_RUNS" -lt 1 ]; then
            echo "No successful Release Qualification found for SHA $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Generate CycloneDX SBOM
        run: |
          uv run --with cyclonedx-bom cyclonedx-py environment -o dist/pyworkflowkit-cyclonedx.json

      - name: Generate and verify SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz pyworkflowkit-cyclonedx.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Generate Artifact Attestations (Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
