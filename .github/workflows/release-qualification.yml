name: Release Qualification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/verify_release_metadata.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/verify_release_metadata.py
          fi

  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Record checksums
        run: sha256sum dist/* | tee dist/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist/
          if-no-files-found: error

  artifact-install:
    name: Artifact install (${{ matrix.python-version }}, ${{ matrix.kind }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            kind: wheel
          - python-version: "3.12"
            kind: wheel
          - python-version: "3.13"
            kind: wheel
          - python-version: "3.13"
            kind: sdist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Resolve expected version
        run: |
          echo "EXPECTED_VERSION=$(python scripts/verify_release_metadata.py --print-version)" >> "$GITHUB_ENV"

      - name: Install built artifact
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.kind }}" == "wheel" ]]; then
            package=$(ls dist/*.whl)
          else
            package=$(ls dist/*.tar.gz)
          fi
          python -m pip install "$package"

      - name: Installed-package contract smoke
        shell: bash
        run: |
          cd /tmp
          python - <<'PY'
          import os
          from importlib.resources import files

          import pyworkflowkit
          from pyworkflowkit.release_contract import release_contract_snapshot

          expected = os.environ["EXPECTED_VERSION"]
          assert pyworkflowkit.__version__ == expected

          snapshot = release_contract_snapshot()
          assert snapshot["package_version"] == expected
          assert snapshot["qualification_contract_version"] == "1"
          assert snapshot["contracts"] == {
              "cli_machine": "1",
              "developer_experience": "1",
              "distribution": "1",
              "manifest": "1",
              "persistence": "1",
              "plugin_api": "1",
              "release_candidate": "1",
              "typing": "1",
          }
          assert snapshot["migration_head"] == "0005_v2_task_output_checkpoints"
          assert snapshot["compatibility"]["contract_version"] == "1"
          assert snapshot["compatibility"]["target_release"] == "1.0.0"
          assert snapshot["compatibility"]["by_status"]["deprecated"] == []
          assert snapshot["compatibility"]["by_status"]["remove-before-1.0"] == []
          assert snapshot["developer_experience"]["contract_version"] == "1"
          assert snapshot["developer_experience"]["target_release"] == "1.0.0"
          assert snapshot["distribution"]["contract_version"] == "1"
          assert snapshot["distribution"]["target_release"] == "1.0.0"
          assert snapshot["release_candidate"]["contract_version"] == "1"
          assert snapshot["release_candidate"]["target_release"] == "1.0.0"
          assert snapshot["typing"]["contract_version"] == "1"
          assert snapshot["typing"]["target_release"] == "1.0.0"
          assert files("pyworkflowkit").joinpath("py.typed").is_file()

          versions = files("pyworkflowkit.migrations.versions")
          assert versions.joinpath("0001_runtime_metadata.py").is_file()
          assert versions.joinpath("0002_task_output_checkpoints.py").is_file()
          assert versions.joinpath("0003_retry_eligible_at.py").is_file()
          assert versions.joinpath("0004_v2_runtime_metadata.py").is_file()
          assert versions.joinpath("0005_v2_task_output_checkpoints.py").is_file()
          PY
          test "$(pyworkflow version)" = "$EXPECTED_VERSION"

      - name: Customer 360 V2 beta from installed artifact
        shell: bash
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/qualify_v2_customer360_beta.py"


  public-api-freeze:
    name: 1.0 public API freeze
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install built wheel and test runner
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl

      - name: Qualify frozen public facades against installed wheel
        run: pytest tests/reference/test_v0_9_public_api_freeze.py -q


  compatibility-deprecation:
    name: 1.0 compatibility & deprecation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install built wheel and qualification tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest dist/*.whl

      - name: Build compatibility fixtures
        run: |
          python -m build --wheel --outdir /tmp/ecosystem-dist ecosystem-template
          python -m build --wheel --outdir /tmp/executor-dist qualification-integrations/reference-executor

      - name: Install historical compatibility fixtures without replacing core
        run: |
          python -m pip install --no-deps /tmp/ecosystem-dist/*.whl
          python -m pip install --no-deps /tmp/executor-dist/*.whl
          expected_version=$(python scripts/verify_release_metadata.py --print-version)
          python -c "from importlib.metadata import version; assert version('pyworkflowkit') == '$expected_version'"

      - name: Qualify RQ-02 against installed wheel
        shell: bash
        run: |
          cd /tmp
          pytest "$GITHUB_WORKSPACE/tests/reference/test_v0_9_compatibility_deprecation.py" -q


  static-typing:
    name: Static typing (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install built wheel and static checker
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy dist/*.whl

      - name: Verify installed PEP 561 marker
        shell: bash
        run: |
          cd /tmp
          python -c "from importlib.resources import files; assert files('pyworkflowkit').joinpath('py.typed').is_file()"

      - name: Type-check public consumer against installed wheel
        shell: bash
        run: |
          cd /tmp
          mypy --strict --python-version "${{ matrix.python-version }}" "$GITHUB_WORKSPACE/typing-fixtures/public_consumer.py"
          mypy --strict --python-version "${{ matrix.python-version }}" "$GITHUB_WORKSPACE/ecosystem-template/src/pyworkflowkit_ecosystem_template/__init__.py"
          mypy --strict --python-version "${{ matrix.python-version }}" "$GITHUB_WORKSPACE/qualification-integrations/reference-executor/src/pyworkflowkit_qualification_executor/__init__.py"
          mypy --strict --python-version "${{ matrix.python-version }}" "$GITHUB_WORKSPACE/reference-integrations/reference-event-sink/src/pyworkflowkit_reference_event_sink/__init__.py"

      - name: Reject unsupported task handler signature
        shell: bash
        run: |
          cd /tmp
          if mypy --strict --python-version "${{ matrix.python-version }}" "$GITHUB_WORKSPACE/typing-fixtures/invalid_task_handler.py"; then
            echo "invalid two-argument @task handler unexpectedly passed static typing"
            exit 1
          fi

      - name: Qualify RQ-03 snapshot against installed wheel
        shell: bash
        run: |
          cd /tmp
          python -m pip install pytest
          pytest "$GITHUB_WORKSPACE/tests/reference/test_v0_9_typing_static_contracts.py" -q


  developer-experience:
    name: 1.0 developer experience
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install built wheel and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl

      - name: Qualify RQ-04 contract against installed wheel
        shell: bash
        run: |
          cd /tmp
          pytest "$GITHUB_WORKSPACE/tests/reference/test_v0_9_developer_experience.py" -q

      - name: Execute first-use journey against installed wheel
        shell: bash
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/qualify_developer_experience.py" --json


  developer-experience-v2:
    name: 1.1 transverse developer experience
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install built wheel and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl

      - name: Qualify Developer Experience Contract v2 against installed wheel
        shell: bash
        run: |
          cd /tmp
          pytest "$GITHUB_WORKSPACE/tests/reference/test_v1_1_cross_surface_dx.py" -q

      - name: Execute transverse 1.1 journey against installed wheel
        shell: bash
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/qualify_v1_1_developer_experience.py" --json

  packaging-distribution:
    name: 1.0 packaging & distribution
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Checkout stable 0.8.0 baseline
        uses: actions/checkout@v4
        with:
          ref: 70cf048ca7264c9c6caf79fd28801f0db50973c5
          path: .rq05-baseline

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install distribution tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Validate distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Rebuild wheel from sdist
        run: |
          mkdir -p /tmp/rq05-rebuilt
          python -m pip wheel --no-deps --wheel-dir /tmp/rq05-rebuilt dist/*.tar.gz

      - name: Install current wheel for artifact inspection
        run: python -m pip install dist/*.whl

      - name: Qualify wheel and sdist contents
        shell: bash
        run: |
          rebuilt=$(ls /tmp/rq05-rebuilt/*.whl)
          python scripts/qualify_distribution.py \
            --dist-dir dist \
            --rebuilt-wheel "$rebuilt" \
            --json

      - name: Clean core install
        shell: bash
        run: |
          wheel=$(realpath dist/*.whl)
          python -m venv /tmp/rq05-core
          /tmp/rq05-core/bin/python -m pip install --upgrade pip
          /tmp/rq05-core/bin/python -m pip install "$wheel"
          /tmp/rq05-core/bin/python -m pip check
          expected_version=$(python scripts/verify_release_metadata.py --print-version)
          test "$(/tmp/rq05-core/bin/pwk version)" = "$expected_version"
          test "$(/tmp/rq05-core/bin/pyworkflow version)" = "$expected_version"
          test "$(/tmp/rq05-core/bin/pyworkflowkit version)" = "$expected_version"

      - name: Install published extras
        shell: bash
        run: |
          wheel=$(realpath dist/*.whl)
          wheel_uri="file://$wheel"
          for extra in postgres dev security; do
            env_dir="/tmp/rq05-extra-$extra"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install --upgrade pip
            "$env_dir/bin/python" -m pip install "pyworkflowkit[$extra] @ $wheel_uri"
            "$env_dir/bin/python" -m pip check
          done
          /tmp/rq05-extra-postgres/bin/python -c "import psycopg"

      - name: Build stable 0.8.0 baseline wheel
        run: |
          mkdir -p /tmp/rq05-baseline-dist
          python -m build --wheel --outdir /tmp/rq05-baseline-dist .rq05-baseline

      - name: Qualify stable upgrade to current artifact
        shell: bash
        run: |
          current_wheel=$(realpath dist/*.whl)
          baseline_wheel=$(realpath /tmp/rq05-baseline-dist/*.whl)
          python -m venv /tmp/rq05-upgrade
          /tmp/rq05-upgrade/bin/python -m pip install --upgrade pip
          /tmp/rq05-upgrade/bin/python -m pip install "$baseline_wheel"
          /tmp/rq05-upgrade/bin/python -c "import pyworkflowkit; assert pyworkflowkit.__version__ == '0.8.0'"
          /tmp/rq05-upgrade/bin/python -m pip install --upgrade --no-deps "$current_wheel"
          /tmp/rq05-upgrade/bin/python -m pip check
          expected_version=$(python scripts/verify_release_metadata.py --print-version)
          /tmp/rq05-upgrade/bin/python -c "import pyworkflowkit; assert pyworkflowkit.__version__ == '$expected_version'"
          test "$(/tmp/rq05-upgrade/bin/pwk version)" = "$expected_version"
          test "$(/tmp/rq05-upgrade/bin/pyworkflow version)" = "$expected_version"
          test "$(/tmp/rq05-upgrade/bin/pyworkflowkit version)" = "$expected_version"

      - name: Qualify RQ-05 contract against installed wheel
        shell: bash
        run: |
          cd /tmp
          python -m pip install pytest
          pytest "$GITHUB_WORKSPACE/tests/reference/test_v0_9_packaging_distribution.py" -q


  release-candidate:
    name: 1.0 release candidate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - metadata
      - build
      - artifact-install
      - public-api-freeze
      - compatibility-deprecation
      - static-typing
      - developer-experience
      - developer-experience-v2
      - packaging-distribution
      - reference-contracts
      - reference-integrations
      - control-plane-provider
      - ecosystem-sdk
      - transverse-v0-8
      - sqlite-upgrade
      - postgres-upgrade
      - security

    steps:
      - name: Require every inherited qualification family
        shell: bash
        run: |
          test "${{ needs.metadata.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.artifact-install.result }}" = "success"
          test "${{ needs.public-api-freeze.result }}" = "success"
          test "${{ needs.compatibility-deprecation.result }}" = "success"
          test "${{ needs.static-typing.result }}" = "success"
          test "${{ needs.developer-experience.result }}" = "success"
          test "${{ needs.developer-experience-v2.result }}" = "success"
          test "${{ needs.packaging-distribution.result }}" = "success"
          test "${{ needs.reference-contracts.result }}" = "success"
          test "${{ needs.reference-integrations.result }}" = "success"
          test "${{ needs.control-plane-provider.result }}" = "success"
          test "${{ needs.ecosystem-sdk.result }}" = "success"
          test "${{ needs.transverse-v0-8.result }}" = "success"
          test "${{ needs.sqlite-upgrade.result }}" = "success"
          test "${{ needs.postgres-upgrade.result }}" = "success"
          test "${{ needs.security.result }}" = "success"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install release candidate wheel and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.whl

      - name: Qualify RQ-06 source contract against installed wheel
        shell: bash
        run: |
          cd /tmp
          pytest "$GITHUB_WORKSPACE/tests/reference/test_v0_9_release_candidate.py" -q

      - name: Qualify installed release candidate
        shell: bash
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/qualify_v1_release_candidate.py" --json

  transverse-v0-8:
    name: 0.8 transverse qualification
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install qualification build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Qualify complete 0.8 ecosystem against built wheel
        shell: bash
        run: |
          core_wheel=$(ls dist/*.whl)
          python scripts/qualify_v0_8_transverse.py --core-wheel "$core_wheel"

  ecosystem-sdk:
    name: Ecosystem SDK (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ecosystem build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Qualify SDK against built wheel
        shell: bash
        run: |
          core_wheel=$(ls dist/*.whl)
          python scripts/qualify_ecosystem_sdk.py --core-wheel "$core_wheel"

  control-plane-provider:
    name: Control-plane provider
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Qualify installed control-plane provider
        shell: bash
        run: |
          core_wheel=$(ls dist/*.whl)
          python scripts/qualify_control_plane_provider.py --core-wheel "$core_wheel"

  reference-integrations:
    name: Reference integration packages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install integration build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build hatchling

      - name: Qualify independently packaged integrations
        shell: bash
        run: |
          core_wheel=$(ls dist/*.whl)
          python scripts/qualify_reference_integrations.py --core-wheel "$core_wheel"

  reference-contracts:
    name: Contract snapshots
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Reference acceptance
        run: pytest tests/reference -q

  sqlite-upgrade:
    name: SQLite upgrade (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: SQLite upgrade matrix
        run: pytest tests/integration/test_migrations.py -q

  postgres-upgrade:
    name: PostgreSQL upgrade (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pyworkflowkit
          POSTGRES_PASSWORD: pyworkflowkit
          POSTGRES_DB: pyworkflowkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pyworkflowkit -d pyworkflowkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYWORKFLOWKIT_TEST_POSTGRES_DSN: postgresql+psycopg://pyworkflowkit:pyworkflowkit@127.0.0.1:5432/pyworkflowkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres]"

      - name: PostgreSQL upgrade matrix
        run: >-
          pytest
          tests/integration/test_migrations_postgres.py
          tests/contract/test_v2_postgresql_metadata_store_contract.py
          -q

  security:
    name: Release security gates
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[security]"

      - name: Bandit
        run: bandit -q -r src/pyworkflowkit -x src/pyworkflowkit/migrations

      - name: Dependency audit
        run: pip-audit --skip-editable

      - name: Secret scan
        run: |
          detect-secrets scan src/pyworkflowkit > /tmp/pyworkflowkit-secrets.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/pyworkflowkit-secrets.json").read_text())
          results = report.get("results", {})
          if results:
              print(json.dumps(results, indent=2, sort_keys=True))
              raise SystemExit("detect-secrets found candidate secrets in src/pyworkflowkit")
          PY

  v2-release-candidate:
    name: V2 2.0 RC lineage
    runs-on: ubuntu-latest
    if: always()
    needs:
      - metadata
      - build
      - artifact-install
      - public-api-freeze
      - compatibility-deprecation
      - static-typing
      - developer-experience
      - developer-experience-v2
      - packaging-distribution
      - release-candidate
      - reference-contracts
      - reference-integrations
      - control-plane-provider
      - ecosystem-sdk
      - transverse-v0-8
      - sqlite-upgrade
      - postgres-upgrade
      - security

    steps:
      - name: Require complete inherited qualification
        shell: bash
        run: |
          test "${{ needs.metadata.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.artifact-install.result }}" = "success"
          test "${{ needs.public-api-freeze.result }}" = "success"
          test "${{ needs.compatibility-deprecation.result }}" = "success"
          test "${{ needs.static-typing.result }}" = "success"
          test "${{ needs.developer-experience.result }}" = "success"
          test "${{ needs.developer-experience-v2.result }}" = "success"
          test "${{ needs.packaging-distribution.result }}" = "success"
          test "${{ needs.release-candidate.result }}" = "success"
          test "${{ needs.reference-contracts.result }}" = "success"
          test "${{ needs.reference-integrations.result }}" = "success"
          test "${{ needs.control-plane-provider.result }}" = "success"
          test "${{ needs.ecosystem-sdk.result }}" = "success"
          test "${{ needs.transverse-v0-8.result }}" = "success"
          test "${{ needs.sqlite-upgrade.result }}" = "success"
          test "${{ needs.postgres-upgrade.result }}" = "success"
          test "${{ needs.security.result }}" = "success"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: pyworkflowkit-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install 2.0 release-line wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Qualify installed V2 RC lineage
        shell: bash
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/qualify_v2_release_candidate.py"


