    runs-on: ubuntu-latest
    if: always()
    needs:
      - metadata
      - build
      - artifact-install
      - public-api-freeze
      - compatibility-deprecation
      - static-typing
      - developer-experience
      - packaging-distribution
      - release-candidate
      - v2-release-candidate
      - v2-stable
      - reference-contracts
      - reference-integrations
      - control-plane-provider
      - ecosystem-sdk
      - transverse-v0-8
      - sqlite-upgrade
      - postgres-upgrade
      - security

    steps:
      - name: Require every release gate
        shell: bash
        run: |
          test "${{ needs.metadata.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.artifact-install.result }}" = "success"
