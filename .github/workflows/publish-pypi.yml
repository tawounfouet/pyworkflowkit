name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable release tag to publish (for example v2.1.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build distributions and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC required for PyPI Trusted Publishing
      contents: write     # Required to upload SBOM and checksums to GitHub Release
      actions: read       # Required to verify qualification for the exact release SHA
      attestations: write # Required for Sigstore artifact build provenance

    environment:
      name: pypi
      url: https://pypi.org/p/pyworkflowkit

    steps:
      - name: Resolve immutable release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "release" ]; then
            RELEASE_TAG="$RELEASE_EVENT_TAG"
          else
            RELEASE_TAG="$DISPATCH_TAG"
          fi

          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Publishing requires an immutable vX.Y.Z tag; got: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.23"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate release tag, commit and package version
        id: identity
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(project["project"]["version"])
          PY
          )"
          RELEASE_SHA="$(git rev-parse HEAD)"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag/package version mismatch: tag=$TAG_VERSION package=$PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require successful Release Qualification for exact release SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          set -euo pipefail

          SUCCESSFUL_RUNS="$(gh api -X GET             "repos/$GITHUB_REPOSITORY/actions/workflows/release-qualification.yml/runs"             -f head_sha="$RELEASE_SHA"             -f status="success"             -f per_page=100             --jq '.workflow_runs | length')"

          if [ "$SUCCESSFUL_RUNS" -lt 1 ]; then
            echo "No successful Release Qualification found for SHA $RELEASE_SHA" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          uv build
          mkdir -p pypi-dist release-assets
          cp dist/*.whl dist/*.tar.gz pypi-dist/
          cp pypi-dist/*.whl pypi-dist/*.tar.gz release-assets/

      - name: Generate CycloneDX SBOM
        run: |
          uv run --with cyclonedx-bom cyclonedx-py environment             -o release-assets/pyworkflowkit-cyclonedx.json

      - name: Generate and verify SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.whl *.tar.gz pyworkflowkit-cyclonedx.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Generate Artifact Attestations (Sigstore)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "release-assets/*"

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            release-assets/*
          fail_on_unmatched_files: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pypi-dist/
