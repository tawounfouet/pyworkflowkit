[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pyworkflowkit"
version = "2.0.0"
description = "Reliable workflows without running a workflow platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Thomas AWOUNFOUET" },
]
keywords = [
  "workflow",
  "dag",
  "orchestration",
  "runtime",
  "python",
  "task",
  "executor",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.16,<2",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.11,<3",
  "rich>=13.8,<16",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "typing-extensions>=4.12,<5",
]

[project.scripts]
pwk = "pyworkflowkit.cli:main"
pyworkflow = "pyworkflowkit.cli:main"
pyworkflowkit = "pyworkflowkit.cli:main"

[project.optional-dependencies]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "build>=1.3,<2",
  "hypothesis>=6,<7",
  "mypy>=1.15,<3",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]
security = [
  "bandit>=1.8,<2",
  "detect-secrets>=1.5,<2",
  "pip-audit>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/tawounfouet/pyworkflowkit"
Documentation = "https://github.com/tawounfouet/pyworkflowkit/tree/main/docs"
Repository = "https://github.com/tawounfouet/pyworkflowkit"
Issues = "https://github.com/tawounfouet/pyworkflowkit/issues"
Changelog = "https://github.com/tawounfouet/pyworkflowkit/blob/main/CHANGELOG.md"
Security = "https://github.com/tawounfouet/pyworkflowkit/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pyworkflowkit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/pyworkflowkit",
  "/README.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["pyworkflowkit"]
omit = [
  "src/pyworkflowkit/migrations/env.py",
  "src/pyworkflowkit/migrations/versions/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
